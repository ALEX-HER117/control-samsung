name: Construir APK Universal TV Remote

on: push: workflow_dispatch:

permissions: contents: write

jobs: fabricar-apk: runs-on: ubuntu-latest

steps:
  - name: Descargar archivos del repositorio
    uses: actions/checkout@v4


  - name: Configurar Java 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Configurar Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Aceptar licencias del SDK de Android
    run: |
      yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

  - name: Estructurar proyecto Android completo automaticamente
    run: |
      mkdir -p app/src/main/java/com/universalremote/app
      mkdir -p app/src/main/res/drawable

      if [ -f "MainActivity.kt" ]; then
        grep -v '^```' MainActivity.kt > app/src/main/java/com/universalremote/app/MainActivity.kt
      else
        FOUND_KT=$(find . -maxdepth 3 -name "MainActivity.kt" | head -n 1)
        if [ -n "$FOUND_KT" ]; then
          grep -v '^```' "$FOUND_KT" > app/src/main/java/com/universalremote/app/MainActivity.kt
        else
          echo "ERROR: No se encontro MainActivity.kt en el repositorio"
          exit 1
        fi
      fi

      if ! grep -q "package com.universalremote.app" app/src/main/java/com/universalremote/app/MainActivity.kt; then
        sed -i '1i package com.universalremote.app\n' app/src/main/java/com/universalremote/app/MainActivity.kt
      fi

      cat << 'EOF' > settings.gradle.kts
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }
      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }
      rootProject.name = "UniversalTvRemote"
      include(":app")
      EOF

      cat << 'EOF' > gradle.properties
      org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
      android.useAndroidX=true
      kotlin.code.style=official
      android.nonTransitiveRClass=true
      EOF

      cat << 'EOF' > build.gradle.kts
      plugins {
          id("com.android.application") version "8.7.3" apply false
          id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
      }
      EOF

      cat << 'EOF' > app/build.gradle.kts
      plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
          id("org.jetbrains.kotlin.plugin.compose")
      }

      android {
          namespace = "com.universalremote.app"
          compileSdk = 35

          defaultConfig {
              applicationId = "com.universalremote.app"
              minSdk = 26
              targetSdk = 35
              versionCode = 1
              versionName = "1.0.0"
          }

          buildTypes {
              release {
                  isMinifyEnabled = false
              }
          }

          compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }

          buildFeatures {
              compose = true
          }
      }

      dependencies {
          val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
          implementation(composeBom)
          implementation("androidx.core:core-ktx:1.15.0")
          implementation("androidx.activity:activity-compose:1.9.3")
          implementation("androidx.compose.ui:ui")
          implementation("androidx.compose.foundation:foundation")
          implementation("androidx.compose.material3:material3")
          implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          implementation("com.squareup.okhttp3:okhttp:4.12.0")
      }
      EOF

      cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
      <vector xmlns:android="http://schemas.android.com/apk/res/android"
          android:width="108dp"
          android:height="108dp"
          android:viewportWidth="108"
          android:viewportHeight="108">
          <path
              android:fillColor="#0B1120"
              android:pathData="M0,0h108v108h-108z" />
          <path
              android:fillColor="#2563EB"
              android:pathData="M54,18A36,36 0,1 1,18 54A36,36 0,0 1,54 18z" />
          <path
              android:fillColor="#FFFFFF"
              android:pathData="M43,32h22a5,5 0,0 1,5 5v34a5,5 0,0 1,-5 5h-22a5,5 0,0 1,-5 -5v-34a5,5 0,0 1,5 -5zM54,44a4,4 0,1 0,0 8a4,4 0,1 0,0 -8zM47,58h14v3h-14zM47,65h14v3h-14z" />
      </vector>
      EOF

      cat << 'EOF' > app/src/main/AndroidManifest.xml
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">

          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
          <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
          <uses-permission android:name="android.permission.TRANSMIT_IR" />
          <uses-permission android:name="android.permission.VIBRATE" />

          <uses-feature
              android:name="android.hardware.consumerir"
              android:required="false" />

          <application
              android:allowBackup="false"
              android:icon="@drawable/ic_launcher"
              android:label="Universal TV Remote"
              android:supportsRtl="true"
              android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
              android:usesCleartextTraffic="true">

              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:screenOrientation="portrait">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
          </application>

      </manifest>
      EOF

  - name: Compilar instalador APK
    run: |
      gradle assembleDebug --no-daemon
      cp app/build/outputs/apk/debug/app-debug.apk UniversalTvRemote.apk

  - name: Subir APK en Artifacts
    uses: actions/upload-artifact@v4
    with:
      name: Universal-TV-Remote-APK
      path: UniversalTvRemote.apk

  - name: Publicar APK directo en Lanzamientos (Releases)
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      gh release delete v1.0.0 --cleanup-tag --yes || true
      gh release create v1.0.0 UniversalTvRemote.apk --title "Universal TV Remote APK" --notes "Toca UniversalTvRemote.apk abajo para descargar e instalar directamente en tu Android." || true
