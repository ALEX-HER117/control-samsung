steps:
  - name: Descargar archivos del repositorio
    uses: actions/checkout@v4

  - name: Configurar Java JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Configurar Gradle 8.7
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Aceptar licencias de Android SDK
    run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

  - name: Ensamblar estructura del proyecto Android automaticamente
    run: |
      mkdir -p app/src/main/java/com/universalremote/app
      mkdir -p app/src/main/res/drawable

      # Ubicar MainActivity.kt sin importar si el usuario lo puso en la raiz o en subcarpeta
      if [ -f "MainActivity.kt" ]; then
        cp MainActivity.kt app/src/main/java/com/universalremote/app/MainActivity.kt
      elif [ -f "android/facil_instalacion/MainActivity.kt" ]; then
        cp android/facil_instalacion/MainActivity.kt app/src/main/java/com/universalremote/app/MainActivity.kt
      else
        echo "No se encontro MainActivity.kt. Asegurate de crear el archivo MainActivity.kt."
        exit 1
      fi

      # Limpiar posibles marcas de bloque si se copiaron por accidente
      sed -i '/^```/d' app/src/main/java/com/universalremote/app/MainActivity.kt

      cat << 'EOF' > gradle.properties
      org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
      android.useAndroidX=true
      android.nonTransitiveRClass=true
      EOF

      cat << 'EOF' > settings.gradle.kts
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }
      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }
      rootProject.name = "UniversalTvRemote"
      include(":app")
      EOF

      cat << 'EOF' > build.gradle.kts
      plugins {
          id("com.android.application") version "8.5.2" apply false
          id("org.jetbrains.kotlin.android") version "1.9.24" apply false
      }
      EOF

      cat << 'EOF' > app/build.gradle.kts
      plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
      }

      android {
          namespace = "com.universalremote.app"
          compileSdk = 34

          defaultConfig {
              applicationId = "com.universalremote.app"
              minSdk = 26
              targetSdk = 34
              versionCode = 1
              versionName = "1.0.0"
          }

          buildFeatures {
              compose = true
          }

          composeOptions {
              kotlinCompilerExtensionVersion = "1.5.14"
          }

          compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }

          lint {
              abortOnError = false
              checkReleaseBuilds = false
          }
      }

      dependencies {
          val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
          implementation(composeBom)
          implementation("androidx.core:core-ktx:1.13.1")
          implementation("androidx.activity:activity-compose:1.9.1")
          implementation("androidx.compose.foundation:foundation")
          implementation("androidx.compose.ui:ui")
          implementation("androidx.compose.material3:material3")
          implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          implementation("com.squareup.okhttp3:okhttp:4.12.0")
      }
      EOF

      # Icono vectorial propio en tema oscuro y azul cobalto (sin depender de imagenes PNG externas)
      cat << 'EOF' > app/src/main/res/drawable/ic_launcher_remote.xml
      <vector xmlns:android="http://schemas.android.com/apk/res/android"
          android:width="108dp"
          android:height="108dp"
          android:viewportWidth="108"
          android:viewportHeight="108">
          <path
              android:fillColor="#0B1120"
              android:pathData="M0,0h108v108h-108z" />
          <path
              android:fillColor="#2563EB"
              android:pathData="M38,24h32c5.5,0 10,4.5 10,10v40c0,5.5 -4.5,10 -10,10H38c-5.5,0 -10,-4.5 -10,-10V34c0,-5.5 4.5,-10 10,-10z" />
          <path
              android:fillColor="#EF4444"
              android:pathData="M54,36m-5,0a5,5 0,1 1,10 0a5,5 0,1 1,-10 0" />
          <path
              android:fillColor="#FFFFFF"
              android:pathData="M54,58m-9,0a9,9 0,1 1,18 0a9,9 0,1 1,-18 0" />
      </vector>
      EOF

      cat << 'EOF' > app/src/main/AndroidManifest.xml
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
          <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
          <uses-permission android:name="android.permission.TRANSMIT_IR" />
          <uses-permission android:name="android.permission.VIBRATE" />

          <uses-feature
              android:name="android.hardware.consumerir"
              android:required="false" />

          <application
              android:allowBackup="false"
              android:icon="@drawable/ic_launcher_remote"
              android:roundIcon="@drawable/ic_launcher_remote"
              android:label="Universal TV Remote"
              android:supportsRtl="true"
              android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
              android:usesCleartextTraffic="true">

              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:screenOrientation="portrait">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
          </application>
      </manifest>
      EOF

  - name: Compilar archivo instalable APK
    run: |
      gradle assembleDebug --no-daemon
      cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/UniversalTvRemote.apk

  - name: Subir APK listo para descargar en tu celular
    uses: actions/upload-artifact@v4
    with:
      name: Universal-TV-Remote-APK
      path: app/build/outputs/apk/debug/UniversalTvRemote.apk
      if-no-files-found: error
      
